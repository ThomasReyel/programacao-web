<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8" />
  </head>

  <body>
    <div><a href="/" id="botaoCarregarC">Carregando cervejas...</a></div>
    <div><a href="/" id="botaoCarregarS">Carregando sorvetes...</a></div>
    <div><a href="/" id="botaoCarregarT">Carregando times...</a></div>

    <div id="meu amor"></div>
  </body>

  <script>
    let cervejas = ["Guiness", "Desperados", "Becks"];
    let times = ["Flamengo", "América-RN", "Chelsea"];
    let sorvetes = ["Chocolate", "Morango", "Balnilha"];

    //function carregar(){

    const carregarDiv = (objeto, event) => {
      event.preventDefault();
      const div = document.getElementById("meu amor");

      const cervejasHtml = objeto.map((item) => `<h1>${item}</h1>`);

      div.innerHTML = `${cervejasHtml.join("\n")}`;
    };

    let botaoC = document.getElementById("botaoCarregarC");
    let botaoS = document.getElementById("botaoCarregarS");
    let botaoT = document.getElementById("botaoCarregarT");

    botaoC.addEventListener("click", () => {
      carregarDiv(cervejas, event);
    });
    botaoS.addEventListener("click", () => {
      carregarDiv(sorvetes, event);
    });
    botaoT.addEventListener("click", () => {
      carregarDiv(times, event);
    });
  </script>
</html>
