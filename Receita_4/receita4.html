<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <style>
    .linha {
      border: 3px solid #ddd;
      padding: 8px;
    }
  </style>

  <body>
    <div id="meu amor">
      <button id="botaoCarregar">Carregando cervejas...</button>
    </div>
    <div>
      <button id="botaoOrdenar">Ordenar cervejas</button>
    </div>
        <div>
      <button id="botaoDesordenar">Desordenar cervejas</button>
    </div>
  </body>

  <script>
    let cervejas = ["Guiness", "Desperados", "Becks"];

    function transformar(item) {
      return `<tr> <td class='linha'>${item}</td> </tr>`;
    }

    function carregarDiv(paramentro) {
      let div = document.getElementById("meu amor");

      //let cervejasHtml = [`<h1>${cervejas[0]}</h1>`,`<h1>${cervejas[1]}</h1>`, `<h1>${cervejas[2]}</h1>`]

      let cervejasHtml = cervejas.map(transformar);
      if (paramentro == "or") {
        cervejasHtml = cervejasHtml.sort();
      } else if (paramentro == "des") {
        cervejasHtml = cervejasHtml.sort(() => Math.random() - 0.5);
      }else{}

      div.innerHTML = `<table> <tr> <th>Bebidas</th> </tr> ${cervejasHtml} </table>`;
    }
    let botaoCarregar = document.getElementById("botaoCarregar")
    let botaoOrdenador = document.getElementById("botaoOrdenar")
    let botaoDesordenador = document.getElementById("botaoDesordenar")
    botaoCarregar.addEventListener("click", () => {carregarDiv("")});
    botaoOrdenador.addEventListener("click", () => {carregarDiv("or")});
    botaoDesordenador.addEventListener("click", () => {carregarDiv("des")});
  </script>
</html>
