<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <style>
    .linha {
      border: 3px solid #ddd;
      padding: 8px;
    }
  </style>

  <body>
    <div id="meu amor">
      <button id="botaoCarregar">Carregando cervejas...</button>
    </div>
    <div>
      <button id="ordenador"> Ordenar cervejas</button>
    </div>
  </body>

  <script>
    let cervejas = ["Guiness", "Desperados", "Becks"];

    function transformar(item) {
      return `<tr> <td class='linha'>${item}</td> </tr>`;
    }

    function carregarDiv() {
      let div = document.getElementById("meu amor");

      //let cervejasHtml = [`<h1>${cervejas[0]}</h1>`,`<h1>${cervejas[1]}</h1>`, `<h1>${cervejas[2]}</h1>`]

      let cervejasHtml = cervejas.map(transformar);

      div.innerHTML = `<table> <tr> <th>Bebidas</th> </tr> ${cervejasHtml} </table>`;
    }

    function ordenarDiv() {
      let div = document.getElementById("meu amor");

      let cervejasHtml = cervejas.map(transformar);
      cervejasHtml = cervejasHtml.sort()

      div.innerHTML = `<table> <tr> <th>Bebidas</th> </tr> ${cervejasHtml} </table>`;
    }

    let botao = document.getElementById("botaoCarregar");
    let botaoOrdenador = document.getElementById("ordenador");

    botao.addEventListener("click", carregarDiv);
    botaoOrdenador.addEventListener("click", ordenarDiv);
  </script>
</html>
