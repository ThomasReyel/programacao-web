<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
    <link href="receita_6.css" rel="stylesheet" />
  </head>

  <body>
    <div><button id="botaoCarregar">Carregando cervejas...</button></div>

    <div id="cervejasDiv"></div>
  </body>

  <script>
    let cervejas = [
      {
        name: "Guiness",
        alcohol: "10%",
        ibu: "35",
        style: "Imperial Stout",
      },
      {
        name: "Desperados",
        alcohol: "6%",
        ibu: "18",
        style: "Cream Ale",
      },
      {
        name: "Becks",
        alcohol: "5%",
        ibu: "22",
        style: "Pilsen",
      },
    ];

    //cs é um array de cervejas

    const carregarDiv = (
      cs,
      id = "cervejasDiv",
      propriedades = ["name", "alcohol", "style", "ibu"],
    ) => {
      const div = document.getElementById(id);
      const cabecalho = propriedades
        .map((chave) => `<th>${chave}</th>`);
      const itensHtml = cs.map(
        (item) => `<tbody>
        <tr>  ${propriedades.map((p) => `<td>${item[p]}</td>`)}</tr>
      </tbody>`,
      );
      div.innerHTML = `<table><thead><tr>${cabecalho}</tr></thead>${itensHtml}</table>`;
    };

    let botao = document.getElementById("botaoCarregar");

    botao.addEventListener("click", () => carregarDiv(cervejas));
  </script>
</html>
