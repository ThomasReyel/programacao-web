<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
    <link href="receita_6.css" rel="stylesheet" />
  </head>

  <body>
    <div><button id="botaoCarregar">Carregando cervejas...</button></div>

    <div id="cervejasDiv"></div>
  </body>

  <script>
    let cervejas = [
      {
        Nome: "Guiness",
        Álcool: "10%",
        Amargor: "35",
        Estilo: "Imperial Stout",
      },
      {
        Nome: "Desperados",
        Álcool: "6%",
        Amargor: "18",
        Estilo: "Cream Ale",
      },
      {
        Nome: "Becks",
        Álcool: "5%",
        Amargor: "22",
        Estilo: "Pilsen",
      },
    ];

    //cs é um array de cervejas

    const carregarDiv = (cs, id = "cervejasDiv") => {
      const div = document.getElementById(id);
      const cabecalho = Object.keys(cs[0]).map((chave) => `<th>${chave}</th>`).join("");
      const itensHtml = cs.map(
        (item) => `<tbody><tr>
          <td>${item["Nome"]}</td>
          <td>${item["Álcool"]}</td>
          <td>${item["Estilo"]}</td>
          <td>${item["Amargor"]}</td>
        </tr>
      </tbody>`,
      );
      div.innerHTML = `<table><thead><tr>${cabecalho}</tr></thead>${itensHtml}</table>`;
    };

    let botao = document.getElementById("botaoCarregar");

    botao.addEventListener("click", () => carregarDiv(cervejas));
  </script>
</html>
