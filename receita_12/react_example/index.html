<!doctype html>

<html>
  <head>
    <title>ReceitaReact - 3</title>
  </head>

  <body>
    <div id="app"></div>

    <script src="libs/react.js"></script>

    <script src="libs/react-dom.js"></script>

    <script src="libs/babel.js"></script>

    <script type="text/babel">
      const TabelaBebidas = ({
        titulo,
        bebidas = [],
        marcas = [],
        cabecalhos = [],
      }) => {
        return (
          <div>
            <h1>{titulo}</h1>

            <table id="tabela" border="1">
              <thead>
                <tr>{cabecalhos.map(cabecalho)}</tr>
              </thead>
              <tbody>
                {bebidas.map((bebida,index) => linhas(bebida,marcas[index]))}
              </tbody>
            </table>
          </div>
        );
      };

      const valoresCabecalhos = ["Nome", "Marca"];
      const bebidasLinhas = ["Uísques", "Cervejas", "Vodkas", "Cachaças"];
      const marcasLinhas = [
        "Jack Daniel's",
        "Budweiser",
        "Smirnoff",
        "Samanaú",
      ];

      function cabecalho(item) {
        return <th>{item}</th>;
      }
      function linhas(item1,item2) {
        return (
          <tr>
            <td>{item1}</td>
            <td>{item2}</td>
          </tr>
        );
      }

      ReactDOM.render(
        <TabelaBebidas
          titulo="minha tabela de cana"
          bebidas={bebidasLinhas}
          marcas={marcasLinhas}
          cabecalhos={valoresCabecalhos}
        />,

        document.getElementById("app"),
      );
    </script>
  </body>
</html>
