<!doctype html>

<html>
  <head>
    <title>ReceitaReact - 3</title>
  </head>

  <body>
    <div id="app"></div>

    <script src="libs/react.js"></script>

    <script src="libs/react-dom.js"></script>

    <script src="libs/babel.js"></script>

    <script type="text/babel">
      const TabelaBebidas = ({ titulo, cabecalhos= [] }) => {
        return (
          <div>
            <h1>{titulo}</h1>

            <table id="tabela" border="1">
              <thead>
                <tr>
                  {cabecalhos.map(linhas)}
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>Havana</td>
                  <td>Engenho Anísio Santiago</td>
                </tr>
              </tbody>
            </table>
          </div>
        );
      };

      const valoresCabecalhos = ["Nome", "Marca"];

      function linhas(item) {
        return <th>{item}</th>
      }

      ReactDOM.render(
        <TabelaBebidas
          titulo="minha tabela de cana"
          cabecalhos={valoresCabecalhos}
        />,

        document.getElementById("app"),
      );
    </script>
  </body>
</html>
