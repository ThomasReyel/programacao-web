<!doctype html>
<html>
  <head>
    <title>ReactZero</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="libs/react.js"></script>
    <script src="libs/react-dom.js"></script>
    <script src="libs/babel.js"></script>
    <script type="text/babel">
      ReactDOM.render(<TabelaBeb/>,

        document.getElementById("app"),
      );
    </script>
    <script>
      function TabelaBeb() {
        return (
          <div id="app">
            <table id="tabela" border="1">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Marca</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>Havana</td>
                  <td>Engenho Anísio Santiago</td>
                </tr>
              </tbody>
            </table>
          </div>
        );
      }
    </script>
  </body>
</html>
