<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ReactZero</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="libs/react.js"></script>
    <script src="libs/react-dom.js"></script>
    <script src="libs/babel.js"></script>
    <script type="text/babel">
      function TabelaBeb() {
        return (
          <div>
            <table id="tabela" border="1">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Marca</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>Havana</td>
                  <td>Engenho Anísio Santiago</td>
                </tr>
              </tbody>
            </table>
          </div>
        );
      }
      function Cabecalho() {
        return <h1>Minha tabela de bebidas</h1>;
      }
    </script>
    <script type="text/babel">
      ReactDOM.render(
         <div>
        <Cabecalho />
        <TabelaBeb />
        </div>,

        document.getElementById("app"),
      );
    </script>
    <div id="app"></div>
  </body>
</html>
